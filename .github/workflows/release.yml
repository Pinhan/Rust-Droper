name: Release

# Runs when a version tag is pushed, e.g.  git tag v1.0.0 && git push origin v1.0.0
# Tags with a suffix (v1.0.0-rc1) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  RUSTDROPER_SKIP_WEBVIEW2: "1"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Build and test (the tag must not ship broken code)
        run: |
          dotnet build RustDroper.slnx -c Release
          dotnet test RustDroper.slnx -c Release --no-build

      - name: Package (portable exe, zip, SHA256SUMS.txt, release notes)
        run: powershell -NoProfile -File build\package-release.ps1 -Version "${{ steps.ver.outputs.version }}" -Output artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rust Droper ${{ steps.ver.outputs.version }}
          body_path: artifacts/RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/RustDroper-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/SHA256SUMS.txt
